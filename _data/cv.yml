    Publications:
      - title: "Language Enabled Hierarchical Scene Graphs for Precision Agriculture Autonomy"
        authors:
          - Adam Mukuddem, Adam Speed-Andrews and Paul Amayo
        publisher: IEEE International Conference on Robotics and Automation (ICRA)
        releaseDate: 2026
        # url: https://www.frontiersin.org/journals/robotics-and-ai/articles/10.3389/frobt.2026.1732004/full
        summary: We advance the 3D Scene graph model introduced of Osiris, adapting it to support autonomy through a Visual Teach and Repeat paradigm, which does not rely on an expansive navigation stack. Additionally, we exploit large language models to correctly ground instructions within the newly constructed 3D scene graph representation, thus enabling natural language directives to be relayed to robotic systems in agricultural contexts.

      - title: "Osiris++: hierarchical representations for robotic-enabled precision agriculture"
        authors:
          - Adam Mukuddem, Adam Speed-Andrews, Thabisa Maweni, Imannuel Nanyaro, Ritvik Sojen, Venny Hsiao, and Paul Amayo.
        publisher: Frontiers in Robotics and AI
        releaseDate: 2026-02-01
        url: https://www.frontiersin.org/journals/robotics-and-ai/articles/10.3389/frobt.2026.1732004/full
        summary: In this work, we introduce Osiris++, a flexible approach designed to allow seamless communication between robots and humans on an array of precision agriculture tasks. We validate and evaluate the performance of Osiris++ in real-world agricultural environments, demonstrating that the system can create accurate and useful scene graphs that aid in solving the assigned tasks. This paves the way for the possibility of allowing natural language instructions, including those in African languages, to be issued to robots within the agricultural sector.

